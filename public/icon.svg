<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle with Safe Zone Margin -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.25" />

  <!-- Shield Shape Center -->
  <path d="M256 96 C330 96 380 128 380 128 C380 260 330 360 256 416 C182 360 132 260 132 128 C132 128 182 96 256 96 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)" />

  <!-- Inner Sparkle / Human Pulse Icon -->
  <path d="M256 168 L274 226 L332 244 L274 262 L256 320 L238 262 L180 244 L238 226 Z" 
        fill="#ffffff" />
  
  <!-- Subtle Check Accent -->
  <path d="M220 348 L244 372 L292 324" 
        fill="none" stroke="#047857" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
</svg>
