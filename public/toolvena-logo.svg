  <defs>
    <linearGradient id="tvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2440"/>
      <stop offset="55%" stop-color="#0F2B46"/>
      <stop offset="100%" stop-color="#12577A"/>
