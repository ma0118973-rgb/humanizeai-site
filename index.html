    <script>
      // Capture Chrome's one-time install prompt before the app bundle loads,
      // otherwise the event is gone before React can listen for it.
      window.__toolvenaPWA = window.__toolvenaPWA || {
        deferredPrompt: null,
        installed: false,
        listeners: [],
      };
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__toolvenaPWA.deferredPrompt = e;
        window.__toolvenaPWA.listeners.forEach(function (fn) {
          try { fn(); } catch (err) {}
        });
      });
      window.addEventListener("appinstalled", function () {
        window.__toolvenaPWA.installed = true;
        window.__toolvenaPWA.deferredPrompt = null;
        window.__toolvenaPWA.listeners.forEach(function (fn) {
          try { fn(); } catch (err) {}
        });
      });
    </script>
